name: Build, Release and Publish Extension

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer a aplicar nesta publicação
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validations:
    name: Validations
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Este workflow só pode ser executado a partir da branch main." >&2
            exit 1
          fi

  build:
    name: Build and Release Extension
    runs-on: ubuntu-latest
    needs: validations

    permissions:
      contents: write

    outputs:
      zip_name: ${{ steps.build.outputs.zip_name }}

    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" -m "chore: release v%s"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

#      - name: Run Tests
#        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Validate ZIP artifact
        id: build
        run: |
          ZIP_PATH="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: release/${{ steps.build.outputs.zip_name }}
          if-no-files-found: error

#      - name: Push version commit and tag
#        run: |
#          git push --follow-tags origin "HEAD:${GITHUB_REF_NAME}"
#
#      - name: Create GitHub Release
#        env:
#          GH_TOKEN: ${{ github.token }}
#          TAG_NAME: ${{ steps.version.outputs.tag_name }}
#          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
#        run: |
#          gh release create "$TAG_NAME" "release/$ZIP_NAME" \
#            --title "$TAG_NAME" \
#            --generate-notes

  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-build
          path: release

#      - name: Publish with Browser Platform Publisher
#        uses: PlasmoHQ/bpp@v3
#        with:
#          keys: ${{ secrets.BPP_KEYS }}
#          artifact: release/${{ needs.build.outputs.zip_name }}
